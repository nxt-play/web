<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>NXT Play - Kaiju No. 8</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <style>
        /* RESET & BASE */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Roboto', sans-serif; }
        body { background-color: #0f1014; color: white; overflow-x: hidden; }

        /* LOADER OVERLAY */
        #AVR { position: fixed; inset: 0; background: #0f1014; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10000; text-align: center; padding: 20px; }
        .nxt-loader0 { width: 45px; height: 45px; border: 4px solid rgba(255,255,255,0.1); border-top-color: #3B82F6; border-radius: 50%; animation: spin 0.8s infinite linear; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* HEADER & BANNER */
        #BG { width: 100%; position: relative; }
        #poster0 { width: 100%; height: 320px; object-fit: cover; mask-image: linear-gradient(to bottom, black 50%, transparent 100%); -webkit-mask-image: linear-gradient(to bottom, black 50%, transparent 100%); }
        .ShowInfo { padding: 0 20px 20px; text-align: center; margin-top: -60px; position: relative; z-index: 2; }
        #title { font-size: 30px; margin-bottom: 8px; font-weight: 700; text-shadow: 0 2px 15px rgba(0,0,0,0.8); }
        #info0 { font-size: 12px; color: #BEC2C7; margin-bottom: 20px; }
        #classplay { background: #fff; color: #000; border: none; padding: 12px 40px; border-radius: 25px; font-weight: 700; cursor: pointer; margin-bottom: 15px; font-size: 15px; }
        #genre { background: rgba(255,255,255,0.1); color: #fff; border: none; padding: 6px 14px; border-radius: 5px; font-size: 11px; text-transform: uppercase; }

        /* SEASON NAVIGATION */
        #abcT { padding: 25px 15px 10px; font-size: 19px; font-weight: 600; border-top: 1px solid #1a1d1d; margin-top: 10px; }
        .season { display: flex; overflow-x: auto; padding: 0 10px 15px; gap: 10px; scrollbar-width: none; }
        .season::-webkit-scrollbar { display: none; }
        .season button { padding: 9px 22px; border-radius: 20px; border: none; background: #1a1d1d; color: #fff; white-space: nowrap; cursor: pointer; }
        #ac { background: #fff !important; color: #000 !important; font-weight: 700; }

        /* EPISODE LIST */
        .ep { display: flex; padding: 15px; gap: 15px; border-bottom: 1px solid #1a1d1d; cursor: pointer; }
        .Eposter img { width: 145px; aspect-ratio: 16/9; border-radius: 8px; object-fit: cover; background: #1a1d1d; }
        .Einfo { flex: 1; min-width: 0; }
        .episode-title { font-size: 15px; margin-bottom: 4px; color: #fff; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .episode-meta { font-size: 11px; color: #BEC2C7; margin-bottom: 6px; }
        .episode-D { font-size: 12px; color: #BEC2C7; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.4; }
        
        .error-msg { color: #ff4d4d; font-size: 14px; line-height: 1.6; margin-top: 20px; max-width: 300px; }
    </style>
</head>
<body>

    <div id="AVR">
        <div class="nxt-loader0"></div>
        <p id="loader-text" style="margin-top:15px; font-size: 14px;">INITIALIZING...</p>
    </div>

    <div id="BG">
        <img id="poster0" src="" alt="">
        <div class="ShowInfo">
            <h1 id="title"></h1>
            <p id="info0"></p>
            <button id="classplay">Watch Now</button><br>
            <button id="genre"></button>
            <p id="info99" style="font-size: 13px; color: #BEC2C7; margin-top: 18px; line-height: 1.6;"></p>
        </div>
    </div>

    <p id="abcT">Episodes</p>
    <div class="season" id="seasonButtonsContainer"></div>
    <div id="episodeContainer"></div>

    <script>
        const JSON_URL = "https://nxt-play.github.io/web/series/anime/AN1NXT5/kaiju-no-8/view_data.json";

        async function loadContent() {
            try {
                // Direct fetch without Proxy
                const response = await fetch(JSON_URL);
                if (!response.ok) throw new Error("HTTP Error " + response.status);
                
                const rawText = await response.text();
                
                // Clean up the JSON (fixes the error at position 6422)
                const start = rawText.indexOf('{');
                const end = rawText.lastIndexOf('}');
                if (start === -1 || end === -1) throw new Error("Invalid JSON structure");
                
                const data = JSON.parse(rawText.substring(start, end + 1));
                
                render(data);
                document.getElementById('AVR').style.display = 'none';
            } catch (err) {
                console.error("Fetch Failed:", err);
                const loaderText = document.getElementById('loader-text');
                loaderText.classList.add('error-msg');
                loaderText.innerHTML = `
                    <strong>LOAD FAILED</strong><br>
                    If testing locally, use a <b>Local Server</b> (Live Server) or upload this file to <b>GitHub Pages</b>.<br>
                    <small>${err.message}</small>
                `;
            }
        }

        function render(data) {
            document.getElementById('title').innerText = data.Title;
            document.getElementById('poster0').src = data.Poster;
            document.getElementById('info99').innerText = data.Info;
            document.getElementById('genre').innerText = data.Genre.replace(/\//g, '  •  ');
            
            const seasons = data.Season;
            const sKeys = Object.keys(seasons).sort(); 
            
            const age = data.Restrictions ? data.Restrictions.Age : "13+";
            document.getElementById('info0').innerHTML = 
                `${data.ReleaseDate}  •  U/A ${age}  •  ${sKeys.length} Seasons  •  ${data.Language}`;

            const sContainer = document.getElementById('seasonButtonsContainer');
            sKeys.forEach((sKey, index) => {
                const btn = document.createElement('button');
                btn.innerText = `Season ${sKey.replace('S', '')}`;
                if (index === 0) {
                    btn.id = 'ac';
                    displayEpisodes(seasons[sKey]);
                }
                btn.onclick = () => {
                    document.querySelectorAll('.season button').forEach(b => b.id = '');
                    btn.id = 'ac';
                    displayEpisodes(seasons[sKey]);
                };
                sContainer.appendChild(btn);
            });
        }

        function displayEpisodes(epObj) {
            const container = document.getElementById('episodeContainer');
            container.innerHTML = '';
            
            // Numerical sort for E1, E2... E10
            const keys = Object.keys(epObj).sort((a,b) => {
                return parseInt(a.replace('E', '')) - parseInt(b.replace('E', ''));
            });

            keys.forEach(k => {
                const ep = epObj[k];
                container.innerHTML += `
                    <div class="ep" onclick="if('${ep.Video}') window.open('${ep.Video}', '_blank')">
                        <div class="Eposter"><img src="${ep.Poster}"></div>
                        <div class="Einfo">
                            <div class="episode-title">${ep.Episode}: ${ep.Title}</div>
                            <div class="episode-meta">${ep.Date}  •  ${ep.Duration}</div>
                            <div class="episode-D">${ep.Info}</div>
                        </div>
                    </div>
                `;
            });
            
            const firstEp = epObj[keys[0]];
            const watchBtn = document.getElementById('classplay');
            watchBtn.innerText = `Watch ${firstEp.Episode}`;
            watchBtn.onclick = () => window.open(firstEp.Video || "#", "_blank");
        }

        loadContent();
    </script>
</body>
</html>
