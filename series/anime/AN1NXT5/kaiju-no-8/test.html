<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>NXT Play - Kaiju No. 8</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <style>
        /* CSS STYLES */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Roboto', sans-serif; }
        body { background-color: #0f1014; color: white; overflow-x: hidden; }

        /* Loader */
        #AVR { position: fixed; inset: 0; background: #0f1014; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10000; }
        .nxt-loader0 { width: 50px; height: 50px; border-radius: 50%; background: conic-gradient(#0F1014, #3B82F6, #A855F7); animation: spin 0.8s infinite linear; }
        @keyframes spin { to { transform: rotate(1turn); } }

        /* Header / Banner */
        #BG { width: 100%; position: relative; text-align: center; }
        #poster0 { width: 100%; height: 280px; object-fit: cover; mask-image: linear-gradient(to bottom, black 60%, transparent 100%); -webkit-mask-image: linear-gradient(to bottom, black 60%, transparent 100%); }
        
        .ShowInfo { padding: 0 20px 20px; margin-top: -40px; }
        #title { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
        #info0 { font-size: 12px; color: #BEC2C7; margin-bottom: 15px; }
        #classplay { background: white; color: black; border: none; padding: 14px 45px; border-radius: 30px; font-weight: bold; cursor: pointer; font-size: 16px; margin-bottom: 10px; }
        #genre { background: #1a1d1d; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
        #info99 { font-size: 13px; color: #BEC2C7; margin: 15px auto; line-height: 1.5; max-width: 600px; }

        /* Season Tabs */
        #abcT { padding: 20px 15px 10px; font-size: 20px; font-weight: 600; border-top: 1px solid #1a1d1d; }
        .season { display: flex; overflow-x: auto; padding: 0 10px 15px; gap: 10px; scrollbar-width: none; }
        .season::-webkit-scrollbar { display: none; }
        .season button { padding: 8px 22px; border-radius: 20px; border: none; background: #1a1d1d; color: white; white-space: nowrap; cursor: pointer; transition: 0.3s; }
        #ac { background: white !important; color: black !important; font-weight: bold; }

        /* Episode List */
        .ep { display: flex; padding: 15px; gap: 12px; border-bottom: 1px solid #1a1d1d; cursor: pointer; transition: background 0.2s; }
        .ep:active { background: #1a1d1d; }
        .Eposter img { width: 150px; aspect-ratio: 16/9; border-radius: 8px; object-fit: cover; background: #222; }
        .Einfo { flex: 1; min-width: 0; }
        .episode-title { font-size: 15px; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .episode-meta { font-size: 11px; color: #BEC2C7; margin-bottom: 5px; }
        .episode-D { font-size: 12px; color: #BEC2C7; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.4; }
    </style>
</head>
<body>

    <div id="AVR">
        <div class="nxt-loader0"></div>
        <p style="margin-top:20px; font-size: 14px;">Fetching Kaiju No. 8...</p>
    </div>

    <div id="BG">
        <img id="poster0" src="" alt="Poster">
        <div class="ShowInfo">
            <h1 id="title">Loading...</h1>
            <p id="info0"></p>
            <button id="classplay">Watch Episode 1</button><br>
            <button id="genre"></button>
            <p id="info99"></p>
        </div>
    </div>

    <p id="abcT">Episodes</p>
    <div class="season" id="seasonButtonsContainer"></div>
    <div id="episodeContainer"></div>

    <script>
        const DATA_URL = "https://nxt-play.github.io/web/series/anime/AN1NXT5/kaiju-no-8/view_data.json";

        async function startApp() {
            try {
                const response = await fetch(DATA_URL);
                const text = await response.text();
                
                // CRITICAL FIX: The JSON has extra characters at the end. 
                // This Regex grabs ONLY the valid { ... } object.
                const jsonMatch = text.match(/\{[\s\S]*\}/);
                if (!jsonMatch) throw new Error("Invalid Data format");
                
                const data = JSON.parse(jsonMatch[0]);
                renderUI(data);
                
                // Remove loader
                document.getElementById('AVR').style.display = 'none';
            } catch (err) {
                console.error("Initialization Failed:", err);
                document.querySelector('#AVR p').innerText = "Load Failed. Please refresh.";
                document.querySelector('#AVR p').style.color = "#ff4d4d";
            }
        }

        function renderUI(data) {
            // 1. Show Metadata
            document.title = "NXT Play - " + data.Title;
            document.getElementById('title').innerText = data.Title;
            document.getElementById('poster0').src = data.Poster;
            document.getElementById('info99').innerText = data.Info;
            document.getElementById('genre').innerText = data.Genre.replace(/\//g, ' • ');
            
            const seasonsArr = Object.keys(data.Season || {});
            document.getElementById('info0').innerHTML = 
                `${data.ReleaseDate} • U/A ${data.Restrictions.Age} • ${seasonsArr.length} Seasons • ${data.Language}`;

            // 2. Season Tabs
            const sContainer = document.getElementById('seasonButtonsContainer');
            const sKeys = seasonsArr.sort(); // Sort S1, S2

            sKeys.forEach((key, index) => {
                const btn = document.createElement('button');
                btn.innerText = `Season ${key.replace('S', '')}`;
                
                if (index === 0) {
                    btn.id = 'ac';
                    loadEpisodes(data.Season[key]);
                }

                btn.onclick = () => {
                    document.querySelectorAll('.season button').forEach(b => b.id = '');
                    btn.id = 'ac';
                    loadEpisodes(data.Season[key]);
                };
                sContainer.appendChild(btn);
            });
        }

        function loadEpisodes(episodes) {
            const container = document.getElementById('episodeContainer');
            container.innerHTML = '';
            
            // Sort Episodes numerically (E1, E2 ... E10)
            const epKeys = Object.keys(episodes).sort((a, b) => {
                const numA = parseInt(a.replace('E', ''));
                const numB = parseInt(b.replace('E', ''));
                return numA - numB;
            });

            epKeys.forEach(key => {
                const ep = episodes[key];
                const epDiv = `
                    <div class="ep" onclick="window.open('${ep.Video}', '_blank')">
                        <div class="Eposter"><img src="${ep.Poster}" loading="lazy"></div>
                        <div class="Einfo">
                            <div class="episode-title">${ep.Episode}: ${ep.Title}</div>
                            <div class="episode-meta">${ep.Date} • ${ep.Duration}</div>
                            <div class="episode-D">${ep.Info}</div>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', epDiv);
            });

            // Update Header Watch Button
            const firstEp = episodes[epKeys[0]];
            const watchBtn = document.getElementById('classplay');
            watchBtn.innerText = `Watch ${firstEp.Episode}`;
            watchBtn.onclick = () => window.open(firstEp.Video, '_blank');
        }

        // Run
        startApp();
    </script>
</body>
</html>
